name: Nightly release!

on:
  schedule:
    - cron: "0 2 * * *"  # Todos los días a las 02:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Republish even if main has not moved"
        type: boolean
        default: false

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  nightly:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Republishing an unchanged main shows up as a brand new version for
      # anyone tracking prereleases in HACS, so only move the nightly when
      # there is something new to move it to.
      - name: Has main moved since the last nightly?
        id: check
        run: |
          head="$(git rev-parse HEAD)"
          echo "head=$head" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.force }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Forced by workflow_dispatch." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! gh release view nightly >/dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "No nightly release yet, creating one at ${head:0:7}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          previous="$(git rev-list -n 1 nightly 2>/dev/null || true)"
          if [ "$previous" = "$head" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No new commits since ${head:0:7}, leaving the nightly release alone." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Moving the nightly release from ${previous:0:7} to ${head:0:7}." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Delete existing nightly release (if exists)
        if: steps.check.outputs.publish == 'true'
        run: gh release delete nightly --cleanup-tag --yes || true

      - name: Create nightly release
        if: steps.check.outputs.publish == 'true'
        run: |
          gh release create nightly \
            --target "${{ steps.check.outputs.head }}" \
            --title "Nightly build" \
            --notes "🚧 Nightly build – commit ${GITHUB_SHA:0:7} on main" \
            --prerelease
